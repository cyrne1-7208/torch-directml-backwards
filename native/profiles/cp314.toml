# CPython 3.14 / Windows x64, with the GIL enabled.
[python]
version = "3.14"

[python.sdk]
version = "3.14.10"
sha256 = "f54ba67c9951c3d773ea47d2bb095150c037c399f0423a968bcda22809241784"

[target.wheels]
"2.14.1" = "d02a4c48a2ca5fb7654e36e71f710f74494d83f1f10aaff8e059dd554adca956"
"2.15.0" = "cf02d11e13819807389e172ecb8f400f6135969af860e2a9f677f67a011e6194"

[[imports]]
library = "python314.dll"
before = "_PyThreadState_UncheckedGet"
after = "PyThreadState_GetUnchecked"

[[edits]]
reason = "Identify the supported CPython minor version in the existing module initializer"
rvas = [0x177430]
before = "332e3132"
after = "332e3134"

# CPython 3.14 adds a tuple hash field, moving the first element from 0x18 to 0x20.
# Update four argument sites, one callback and the MHA/RoPE return values.
[[edits]]
reason = "Use the CPython 3.14 tuple element offset in argument dispatch and tuple results"
rvas = [0x116704, 0x11699f, 0x116a64, 0x11723e, 0x118888, 0x11fe60, 0x120fd0]
before = "18"
after = "20"

[[edits]]
reason = "Use the CPython 3.14 tuple element offset when traversing type bases"
rvas = [0x1120e2, 0x112444, 0x113717]
before = "488d4f18"
after = "488d4f20"

# The list element pointer remains at 0x18; do not move it with the tuple elements.
[[edits]]
reason = "Retain the list element pointer at its original offset in sequence traversal"
rvas = [0x1120f8, 0x11245a, 0x11372d]
before = "7408488b19488bcbeb03488bd9"
after = "7404488b4f18488bd990909090"

[native]
sources = ["python_bindings.cpp"]

[[native.trampolines]]
reason = "Traverse CPython 3.14 managed dictionaries without materializing them during GC"
rva = 0x1142c0
before = "48895c2408"
symbol = "tdml_python_traverse"

[[native.trampolines]]
reason = "Clear CPython 3.14 managed dictionaries through the current API"
rva = 0x114330
before = "4883ec28ff15be560400"
symbol = "tdml_python_clear"

[[native.trampolines]]
reason = "Acquire the original GIL guard using the current PyThreadState layout"
rva = 0x114370
before = "48895c2408"
symbol = "tdml_gil_acquire"

[[native.trampolines]]
reason = "Release the original GIL guard using the current PyThreadState layout"
rva = 0x114420
before = "40534883ec20"
symbol = "tdml_gil_dec_ref"
