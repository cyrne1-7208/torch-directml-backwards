name: GCP CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    name: 1. Authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.access.outputs.revision }}
      plan: ${{ steps.changes.outputs.plan }}
    steps:
      # No checkout or PR code runs before this gate.
      - name: 1.1. Authorize the branch and initiator
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          INITIATOR: ${{ github.triggering_actor }}
          PR_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Select main when running this workflow manually'
            exit 1
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$INITIATOR/permission" --jq .permission)
          case "$permission" in
            admin|write) ;;
            *) echo "::error::$INITIATOR needs write or admin access to run CI"; exit 1 ;;
          esac
          echo "revision=${PR_REVISION:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: 1.2. Check out trusted selection rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
          ref: ${{ github.workflow_sha }}
      - name: 1.3. Select checks affected by this change
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.access.outputs.revision }}
        run: python3 tools/ci/changes.py

  checks:
    name: 2-6. Validation
    needs: authorize
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: ./.github/workflows/gcp.yml
    with:
      revision: ${{ needs.authorize.outputs.revision }}
      plan: ${{ needs.authorize.outputs.plan }}
    secrets:
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
